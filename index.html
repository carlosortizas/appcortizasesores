<html lang="es">
<head>

<script>
/* Respaldo de almacenamiento para GitHub Pages: si no existe window.storage (Claude), usa localStorage del navegador */
if(!window.storage){
  window.storage={
    async get(k){ try{ const v=localStorage.getItem('cortiz:'+k); return v===null?null:{key:k,value:v}; }catch(e){ return null; } },
    async set(k,v){ localStorage.setItem('cortiz:'+k,v); return {key:k,value:v}; },
    async delete(k){ localStorage.removeItem('cortiz:'+k); return {key:k,deleted:true}; }
  };
}
</script>

<style>
:root{
  --ink:#14242E; --ink2:#3C4C56; --ink3:#7C8A92;
  --paper:#F6F7F6; --paper2:#FFFFFF; --line:rgba(20,36,46,.12); --line2:rgba(20,36,46,.22);
  --brand:#0D6E5E; --brand-l:#E1F0EC; --brand-d:#084A3F;
  --amber:#B8791A; --amber-l:#FBEEDA;
  --red:#B23B3B; --red-l:#FBEAEA;
  --gray-l:#EEEDE9;
  --serif:'Source Serif 4',Georgia,serif; --sans:'Inter',-apple-system,sans-serif; --mono:'JetBrains Mono',monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:13.5px;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}

/* SHELL */
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:0;padding:0 16px;background:var(--ink);border-bottom:3px solid var(--brand);height:46px;position:sticky;top:0;z-index:20}
.brand{font-family:var(--serif);font-size:16px;font-weight:600;color:#fff;padding-right:22px;border-right:1px solid rgba(255,255,255,.15);margin-right:6px;white-space:nowrap;letter-spacing:.2px}
.brand span{color:var(--brand);opacity:.9}
.tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;height:46px;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;padding:0 16px;height:100%;border:none;background:transparent;color:rgba(255,255,255,.68);font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:.12s}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--brand)}
.tab.soon{opacity:.38;cursor:default}
.tab.soon:hover{color:rgba(255,255,255,.62)}
.tab svg{width:19px;height:19px;flex-shrink:0}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;padding:5px 12px;background:rgba(255,255,255,.08);border-radius:16px;flex-shrink:0}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0}
.userchip .uname{font-size:11.5px;color:#fff;font-weight:500;line-height:1.3}
.userchip .urol{font-size:9.5px;color:rgba(255,255,255,.55);line-height:1.2}

.main{flex:1;padding:24px 28px 60px;max-width:1180px;margin:0 auto;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink)}
.ph p{font-size:12px;color:var(--ink3);margin-top:3px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--paper2);cursor:pointer;color:var(--ink);font-weight:500;transition:.1s}
.btn:hover{background:var(--gray-l)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--gray-l)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.danger{color:var(--red);border-color:rgba(178,59,59,.35)}
.btn.danger:hover{background:var(--red-l)}
.btn svg{width:14px;height:14px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink3);cursor:pointer}
.iconbtn:hover{background:var(--gray-l);color:var(--ink)}
.iconbtn svg{width:15px;height:15px}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.mc{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mc-l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.mc-n{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);line-height:1}

/* TOOLBAR */
.tb{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.src{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--paper2);color:var(--ink)}
.src:focus{outline:none;border-color:var(--brand)}
.sel{padding:9px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--paper2);color:var(--ink)}

/* TABLE / CARDS */
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--paper)}
.stamp{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.stamp.on{background:var(--brand)}
.stamp.off{background:var(--ink3)}
.tname{font-size:13.5px;font-weight:500;color:var(--ink)}
.tsub{font-size:11.5px;color:var(--ink3);margin-top:3px;font-family:var(--mono);line-height:1.5}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.roles{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
.pill.brand{background:var(--brand-l);color:var(--brand-d)}
.pill.amber{background:var(--amber-l);color:#7A5310}
.pill.gray{background:var(--gray-l);color:var(--ink2)}
.pill.red{background:var(--red-l);color:var(--red)}

.empty{padding:60px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.35}
.empty h3{font-family:var(--serif);font-size:16px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.empty p{font-size:12px;margin-bottom:16px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(20,36,46,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--paper2);border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.mhead h2{font-family:var(--serif);font-size:17px;font-weight:600}
.mbody{padding:20px 22px;max-height:65vh;overflow-y:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.frow.full{grid-template-columns:1fr}
.fg label{display:block;font-size:11px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:7px;background:var(--paper);color:var(--ink)}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--brand);background:#fff}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--paper);cursor:pointer;font-size:11.5px;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* TOAST */
.toast{position:fixed;top:66px;right:20px;padding:10px 16px;border-radius:9px;font-size:12.5px;z-index:99;opacity:0;transform:translateY(-6px);transition:.25s;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--brand-l);color:var(--brand-d);border:1px solid var(--brand)}
.toast.err{background:var(--red-l);color:var(--red);border:1px solid var(--red)}

.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--ink3);font-size:13px}
.stabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.stab{padding:9px 14px;font-size:12.5px;color:var(--ink3);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px}
.stab.on{color:var(--brand-d);border-bottom-color:var(--brand);font-weight:500}
.stab2{padding:7px 12px;font-size:12px;color:var(--ink3);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px}
.stab2.on{color:var(--brand-d);border-bottom-color:var(--brand);font-weight:500}
.badge-count{background:var(--gray-l);color:var(--ink2);border-radius:10px;padding:1px 7px;font-size:10px;margin-left:5px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}@media (max-width:640px){
  .frow{grid-template-columns:1fr}
  .main{padding:16px 14px 60px}
  .modal{max-width:94vw;border-radius:12px}
  .overlay{padding:16px 8px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .userchip .uname,.userchip .urol{display:none}
  .userchip{padding:5px 8px}
}
</style>
</head>

<div id="loading" class="loading">Cargando Cortiz Asesores…</div>
<div id="app" class="shell" style="display:none"></div>

<div style="position:fixed;bottom:10px;right:14px;text-align:right;pointer-events:none;z-index:5">

</div>

<script>
/* ================= STORAGE ================= */
const KEY_CLIENTES='cortiz:clientes';
const KEY_BIBLIOTECA='cortiz:biblioteca';
const KEY_VENC_ESTADOS='cortiz:venc-estados';
const KEY_TAREAS='cortiz:tareas';
const KEY_PROCESOS='cortiz:procesos';
const KEY_VISITAS='cortiz:visitas';
const KEY_PENDIENTES='cortiz:pendientes';
const KEY_CLAVES='cortiz:claves';
const KEY_CLAVES_LOG='cortiz:claves-log';
const KEY_JURIDICO_ITEMS='cortiz:juridico-items';
const KEY_JURIDICO_ESTADOS='cortiz:juridico-estados';
const KEY_JURIDICO_CASOS='cortiz:juridico-casos';
const KEY_EQUIPO='cortiz:equipo';
let DB={clientes:[],biblioteca:[],vencEstados:{},tareas:[],procesos:[],visitas:[],pendientes:[],claves:[],clavesLog:[],juridicoItems:[],juridicoEstados:{},juridicoCasos:[],equipo:[]};

async function loadAll(){
  try{
    const c=await window.storage.get(KEY_CLIENTES,true);
    DB.clientes=c?JSON.parse(c.value):[];
  }catch(e){DB.clientes=[];}
  try{
    const b=await window.storage.get(KEY_BIBLIOTECA,true);
    DB.biblioteca=b?JSON.parse(b.value):null;
  }catch(e){DB.biblioteca=null;}
  if(!DB.biblioteca){ DB.biblioteca=seedBiblioteca(); await saveBiblioteca(); }
  try{
    const v=await window.storage.get(KEY_VENC_ESTADOS,true);
    DB.vencEstados=v?JSON.parse(v.value):{};
  }catch(e){DB.vencEstados={};}
  try{
    const t=await window.storage.get(KEY_TAREAS,true);
    DB.tareas=t?JSON.parse(t.value):[];
  }catch(e){DB.tareas=[];}
  try{
    const p=await window.storage.get(KEY_PROCESOS,true);
    DB.procesos=p?JSON.parse(p.value):null;
  }catch(e){DB.procesos=null;}
  if(!DB.procesos){ DB.procesos=seedProcesos(); await saveProcesos(); }
  try{
    const vi=await window.storage.get(KEY_VISITAS,true);
    DB.visitas=vi?JSON.parse(vi.value):[];
  }catch(e){DB.visitas=[];}
  try{
    const pe=await window.storage.get(KEY_PENDIENTES,true);
    DB.pendientes=pe?JSON.parse(pe.value):[];
  }catch(e){DB.pendientes=[];}
  try{
    const cl=await window.storage.get(KEY_CLAVES,true);
    DB.claves=cl?JSON.parse(cl.value):[];
  }catch(e){DB.claves=[];}
  try{
    const clg=await window.storage.get(KEY_CLAVES_LOG,true);
    DB.clavesLog=clg?JSON.parse(clg.value):[];
  }catch(e){DB.clavesLog=[];}
  try{
    const ji=await window.storage.get(KEY_JURIDICO_ITEMS,true);
    DB.juridicoItems=ji?JSON.parse(ji.value):null;
  }catch(e){DB.juridicoItems=null;}
  if(!DB.juridicoItems){ DB.juridicoItems=seedJuridico(); await saveJuridicoItems(); }
  try{
    const je=await window.storage.get(KEY_JURIDICO_ESTADOS,true);
    DB.juridicoEstados=je?JSON.parse(je.value):{};
  }catch(e){DB.juridicoEstados={};}
  try{
    const jc=await window.storage.get(KEY_JURIDICO_CASOS,true);
    DB.juridicoCasos=jc?JSON.parse(jc.value):[];
  }catch(e){DB.juridicoCasos=[];}
  try{
    const eq=await window.storage.get(KEY_EQUIPO,true);
    DB.equipo=eq?JSON.parse(eq.value):null;
  }catch(e){DB.equipo=null;}
  if(!DB.equipo){ DB.equipo=seedEquipo(); await saveEquipo(); }
}
function seedEquipo(){
  return [{id:uid(),nombre:'Carlos A. Ortiz',rol:'Gerente',correo:'',telefono:'',activo:true}];
}
function nombresEquipo(){ return DB.equipo.filter(e=>e.activo).map(e=>e.nombre); }
function respOpciones(){ return [...nombresEquipo(),'Todo el equipo']; }
function identidades(){ return DB.equipo.filter(e=>e.activo).map(e=>`${e.nombre} (${e.rol})`); }
function seedJuridico(){
  return ['Acta de asamblea anual','Acta de junta de socios','Libro de actas al día','RUT actualizado','Certificado de existencia y representación legal','Nombramiento de representante legal vigente'].map(n=>({id:uid(),nombre:n,activo:true}));
}
async function saveTareas(){
  try{ await window.storage.set(KEY_TAREAS,JSON.stringify(DB.tareas),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveProcesos(){
  try{ await window.storage.set(KEY_PROCESOS,JSON.stringify(DB.procesos),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveVisitas(){
  try{ await window.storage.set(KEY_VISITAS,JSON.stringify(DB.visitas),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function savePendientes(){
  try{ await window.storage.set(KEY_PENDIENTES,JSON.stringify(DB.pendientes),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveClaves(){
  try{ await window.storage.set(KEY_CLAVES,JSON.stringify(DB.claves),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveClavesLog(){
  try{ await window.storage.set(KEY_CLAVES_LOG,JSON.stringify(DB.clavesLog),true); }
  catch(e){}
}
async function saveJuridicoItems(){
  try{ await window.storage.set(KEY_JURIDICO_ITEMS,JSON.stringify(DB.juridicoItems),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveJuridicoEstados(){
  try{ await window.storage.set(KEY_JURIDICO_ESTADOS,JSON.stringify(DB.juridicoEstados),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveJuridicoCasos(){
  try{ await window.storage.set(KEY_JURIDICO_CASOS,JSON.stringify(DB.juridicoCasos),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveEquipo(){
  try{ await window.storage.set(KEY_EQUIPO,JSON.stringify(DB.equipo),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
function seedProcesos(){
  const data=[
    ['Contabilidad',['Revisión de causaciones','Conciliación de cartera y proveedores','Conciliación bancaria','Cierre contable del mes']],
    ['Nómina',['Afiliación de empleados nuevos','Generar certificados de afiliación pendientes','Nómina quincenal','Revisar incapacidades','Revisar PILA']],
    ['Impuestos',['Revisión de retenciones practicadas','Verificar facturación electrónica','Revisar soportes para DIAN']],
    ['Administrativo',['Actualización de terceros','Revisión de inventarios','Pago a proveedores']],
  ];
  const out=[];
  data.forEach(([cat,items])=>items.forEach(nombre=>out.push({id:uid(),cat,nombre,activo:true})));
  return out;
}
async function saveClientes(){
  try{ await window.storage.set(KEY_CLIENTES,JSON.stringify(DB.clientes),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveBiblioteca(){
  try{ await window.storage.set(KEY_BIBLIOTECA,JSON.stringify(DB.biblioteca),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
async function saveVencEstados(){
  try{ await window.storage.set(KEY_VENC_ESTADOS,JSON.stringify(DB.vencEstados),true); }
  catch(e){ toast('No se pudo guardar. Verifica tu conexión.','err'); }
}
function buildSeq(vals){ // 10 valores en orden: dígito 1,2,3,4,5,6,7,8,9,0
  const digs=['1','2','3','4','5','6','7','8','9','0'];
  const m={}; digs.forEach((d,i)=>m[d]=vals[i]); return m;
}
function buildPares(v12,v34,v56,v78,v90){
  return {'1':v12,'2':v12,'3':v34,'4':v34,'5':v56,'6':v56,'7':v78,'8':v78,'9':v90,'0':v90};
}
function seedBiblioteca(){
  return [
    // DIAN — Retención en la fuente (mensual), fechas reales calendario DIAN 2026
    {id:uid(),cat:'DIAN Nacional',nom:'Retención en la Fuente',per:'Mensual',
      nota:'Calendario DIAN 2026, último dígito del NIT (sin dígito de verificación)',activo:true,diaBase:20,meses:[],roles:['contabilidad'],
      porDigito:{
        2:buildSeq([10,11,12,13,16,17,18,19,20,23]),
        3:buildSeq([10,11,12,13,16,17,18,19,20,24]),
        4:buildSeq([13,14,15,16,20,21,22,23,24,27]),
        5:buildSeq([12,13,14,15,19,20,21,22,25,26]),
        6:buildSeq([10,11,12,16,17,18,19,22,23,24]),
        7:buildSeq([9,10,14,15,16,17,21,22,23,24]),
        8:buildSeq([12,13,14,18,19,20,21,24,25,26]),
        9:buildSeq([9,10,11,14,15,16,17,18,21,22]),
        10:buildSeq([9,13,14,15,16,19,20,21,22,23]),
        11:buildSeq([11,12,13,17,18,19,20,23,24,25]),
        12:buildSeq([10,11,14,15,16,17,18,21,22,23]),
        1:buildSeq([13,14,15,18,19,20,21,22,25,26])
      }},
    // DIAN — IVA Bimestral, fechas reales
    {id:uid(),cat:'DIAN Nacional',nom:'IVA Bimestral',per:'Bimestral',
      nota:'Calendario DIAN 2026 · Ene-Feb, Mar-Abr, May-Jun, Jul-Ago, Sep-Oct, Nov-Dic. Solo para clientes de régimen Ordinario con periodicidad de IVA = Bimestral.',activo:true,diaBase:20,meses:[3,5,7,9,11,1],roles:['contabilidad'],
      aplicaRegimenRST:false,ivaPeriodicidad:'bimestral',
      porDigito:{
        3:buildSeq([10,11,12,13,16,17,18,19,20,24]),
        5:buildSeq([12,13,14,15,19,20,21,22,25,26]),
        7:buildSeq([9,10,14,15,16,17,21,22,23,24]),
        9:buildSeq([9,10,11,14,15,16,17,18,21,22]),
        11:buildSeq([11,12,13,17,18,19,20,23,24,25]),
        1:buildSeq([13,14,15,18,19,20,21,22,25,26])
      }},

function agruparLista(lista,modo){
  if(modo==='fecha') return null;
  const keyFn={
    cliente:v=>v.clienteNombre,
    obligacion:v=>v.obligNombre,
    categoria:v=>v.cat,
    responsable:v=>v.responsable
  }[modo];
  const map=new Map();
  lista.forEach(v=>{
    const k=keyFn(v);
    if(!map.has(k)) map.set(k,[]);
    map.get(k).push(v);
  });
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([label,items])=>({label,items:items.sort((a,b)=>a.fecha-b.fecha)}));
}

function ultimoDigitoNit(nit){
  const clean=(nit||'').trim();
  const dashIdx=clean.indexOf('-');
  const base = dashIdx>-1 ? clean.slice(0,dashIdx) : clean;
  const digits = base.replace(/[^0-9]/g,'');
  return digits.slice(-1);
}
function computeVencimientosMes(year,month){ // month: 1-12
  const out=[];
  const activos=DB.clientes.filter(c=>c.estado==='activo');
  for(const c of activos){
    const roles=c.roles&&c.roles.length?c.roles:['contabilidad'];
    const etiquetas=c.etiquetas||[];
    for(const o of DB.biblioteca){
      if(!o.activo) continue;
      if(o.etiqueta){
        if(!etiquetas.includes(o.etiqueta)) continue;
      }else{
        const aplicaRoles=(o.roles&&o.roles.length)?o.roles:['contabilidad'];
        if(!roles.some(r=>aplicaRoles.includes(r))) continue;
      }
      const esRST=(c.regimen||'').startsWith('RST');
      if(o.aplicaRegimenRST===true && !esRST) continue;
      if(o.aplicaRegimenRST===false && esRST) continue;
      if(o.ivaPeriodicidad && (c.periodicidadIVA||'bimestral')!==o.ivaPeriodicidad) continue;
      const esMensual=o.per==='Mensual';
      const aplicaMes=esMensual || (o.meses&&o.meses.includes(month));
      if(!aplicaMes) continue;
      let dia=o.diaBase||15;
      if(o.porDigito && o.porDigito[month]){
        const ultimoDigito=ultimoDigitoNit(c.nit);
        const d=o.porDigito[month][ultimoDigito];
        if(d) dia=d;
      }
      dia=Math.min(dia,new Date(year,month,0).getDate());
      const fecha=new Date(year,month-1,dia);
      const key=`${c.id}|${o.id}|${year}-${month}`;
      const respTxt=clienteResponsables(c).join(', ')||'Sin asignar';
      out.push({key,clienteId:c.id,clienteNombre:c.nombre,responsable:respTxt,obligId:o.id,obligNombre:o.nom,cat:o.cat,fecha,cumplido:!!(DB.vencEstados[key]&&DB.vencEstados[key].cumplido)});
    }
  }
  out.sort((a,b)=>a.fecha-b.fecha);
  return out;
}
function computeVencimientosSemana(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const en7=new Date(hoy); en7.setDate(en7.getDate()+7);
  const meses=new Set([hoy.getMonth()+1]);
  if(en7.getMonth()!==hoy.getMonth()) meses.add(en7.getMonth()+1);
  let all=[];
  meses.forEach(m=>{ const y=(m===1&&hoy.getMonth()+1===12)?hoy.getFullYear()+1:hoy.getFullYear(); all=all.concat(computeVencimientosMes(y,m)); });
  return all.filter(v=>v.fecha>=hoy && v.fecha<=en7).sort((a,b)=>a.fecha-b.fecha);
}
function fmtFecha(d){ return `${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()]}`; }

    </select>
  </div>
  <div class="panel">

  </div>`;
}
function rVencCalendarioView(){
  const y=VENC_CURSOR.getFullYear(), m=VENC_CURSOR.getMonth();
  const lista=computeVencimientosMes(y,m+1);
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayIso=isoDate(new Date());
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  return `
  <div class="tb">
    <button class="iconbtn" id="vcalPrev">‹</button>
    <span style="font-size:14px;font-weight:500;min-width:130px;text-align:center;font-family:var(--serif)">${MESES[m]} ${y}</span>
    <button class="iconbtn" id="vcalNext">›</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden">
    ${DIAS_SEM.map(d=>`<div style="background:var(--paper);padding:7px 8px;font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px">${d}</div>`).join('')}
    ${cells.map(d=>{
      if(!d) return `<div style="background:var(--paper2);min-height:88px"></div>`;
      const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const delDia=lista.filter(v=>isoDate(v.fecha)===iso);
      const esHoy=iso===todayIso;
      return `<div style="background:var(--paper2);min-height:88px;padding:6px;display:flex;flex-direction:column;gap:3px">
        <div style="font-size:11px;font-weight:${esHoy?'600':'400'};color:${esHoy?'var(--brand-d)':'var(--ink3)'}">${d}${esHoy?' · hoy':''}</div>
        ${delDia.slice(0,3).map(v=>`<div class="vcalPill" data-key="${v.key}" title="${v.obligNombre}" style="font-size:10px;padding:2px 6px;border-radius:5px;cursor:pointer;background:${v.cumplido?'var(--brand-l)':'var(--amber-l)'};color:${v.cumplido?'var(--brand-d)':'#7A5310'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.clienteNombre}</div>`).join('')}
        ${delDia.length>3?`<div style="font-size:9.5px;color:var(--ink3)">+${delDia.length-3} más</div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}
function rVencRow(v,showCliente,showObligacion){
  return `<div class="trow" style="cursor:default">
    <input type="checkbox" class="chkVenc" data-key="${v.key}" ${v.cumplido?'checked':''} style="width:16px;height:16px;accent-color:var(--brand);cursor:pointer">
    <div><div class="tname">${showCliente?v.clienteNombre:v.obligNombre}</div><div class="tsub" style="font-family:var(--sans)">${showObligacion?v.obligNombre+' · ':''}${showCliente?v.cat:v.clienteNombre}</div></div>
    <div class="tright"><span class="pill ${v.cumplido?'brand':'amber'}">${v.cumplido?'Cumplido':fmtFecha(v.fecha)}</span></div>
  </div>`;
}
function rVencItems(lista){
  if(VENC_AGRUPAR==='fecha'){
    return lista.map(v=>rVencRow(v,true,true)).join('');
  }
  const groups=agruparLista(lista,VENC_AGRUPAR);
  const showCliente = VENC_AGRUPAR!=='cliente';
  const showObligacion = VENC_AGRUPAR!=='obligacion';
  return groups.map(g=>`
    <div style="padding:11px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px">
      ${g.label}<span class="badge-count">${g.items.length}</span>
    </div>
    ${g.items.map(v=>rVencRow(v,showCliente,showObligacion)).join('')}
  `).join('');
}
function emptyVenc(){
  return `<div class="empty">${icon('cal')}<h3>Nada por aquí</h3><p>${DB.clientes.filter(c=>c.estado==='activo').length===0?'Crea clientes activos para que aparezcan sus vencimientos.':'No hay vencimientos que coincidan con este filtro.'}</p></div>`;
}
function wireVencimientos(){
  document.querySelectorAll('[data-vv]').forEach(b=>b.onclick=()=>{ VENC_VISTA=b.dataset.vv; renderMain(); });
  const s=document.getElementById('modoSemana'); if(s) s.onclick=()=>{VENC_MODO='semana'; renderMain();};
  const me=document.getElementById('modoMes'); if(me) me.onclick=()=>{VENC_MODO='mes'; renderMain();};
  const prev=document.getElementById('mesPrev'); if(prev) prev.onclick=()=>{VENC_CURSOR.setMonth(VENC_CURSOR.getMonth()-1); renderMain();};
  const next=document.getElementById('mesNext'); if(next) next.onclick=()=>{VENC_CURSOR.setMonth(VENC_CURSOR.getMonth()+1); renderMain();};
  const vprev=document.getElementById('vcalPrev'); if(vprev) vprev.onclick=()=>{VENC_CURSOR.setMonth(VENC_CURSOR.getMonth()-1); renderMain();};
  const vnext=document.getElementById('vcalNext'); if(vnext) vnext.onclick=()=>{VENC_CURSOR.setMonth(VENC_CURSOR.getMonth()+1); renderMain();};
  const fs=document.getElementById('filtroSel'); if(fs) fs.onchange=(e)=>{VENC_FILTRO=e.target.value; renderMain();};
  const ag=document.getElementById('agruparSel'); if(ag) ag.onchange=(e)=>{VENC_AGRUPAR=e.target.value; renderMain();};
  document.querySelectorAll('.chkVenc').forEach(chk=>chk.onchange=async(e)=>{
    const key=chk.dataset.key;
    DB.vencEstados[key]={cumplido:e.target.checked,fecha:new Date().toISOString()};
    await saveVencEstados();
    toast(e.target.checked?'Marcado como cumplido':'Marcado como pendiente');
    renderMain();
  });
  document.querySelectorAll('.vcalPill').forEach(p=>p.onclick=async()=>{
    const key=p.dataset.key;
    const actual=DB.vencEstados[key]&&DB.vencEstados[key].cumplido;
    DB.vencEstados[key]={cumplido:!actual,fecha:new Date().toISOString()};
    await saveVencEstados(); renderMain();
  });
}

function rCalendarView(){

  const startOffset=(first.getDay()+6)%7; // lunes=0

  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(y,m,d));
  while(cells.length%7!==0) cells.push(null);

  return `
  <div class="tb">

/* ---------- CUMPLIMIENTO ---------- */
function rCumplimientoView(){
  const hoy=new Date();
  const activos=DB.clientes.filter(c=>c.estado==='activo');
  const filas=activos.map(c=>{
    const visitasCliente=DB.visitas.filter(v=>v.clienteId===c.id&&v.estado==='realizada').sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const ultima=visitasCliente[0];
    const dias=ultima?Math.floor((hoy-new Date(ultima.fecha+'T00:00:00'))/86400000):null;
    const limite=c.frecuenciaVisita==='semanal'?7:30;
    const atrasado = dias===null || dias>limite;
    return {c,ultima,dias,atrasado};
  }).sort((a,b)=>(b.atrasado-a.atrasado) || ((b.dias??999)-(a.dias??999)));
  const atrasados=filas.filter(f=>f.atrasado).length;
  return `
  <div class="metrics">
    <div class="mc"><div class="mc-l">Clientes atrasados</div><div class="mc-n" style="color:var(--red)">${atrasados}</div></div>
    <div class="mc"><div class="mc-l">Al día</div><div class="mc-n" style="color:var(--brand)">${filas.length-atrasados}</div></div>
    <div class="mc"><div class="mc-l">Total clientes activos</div><div class="mc-n">${filas.length}</div></div>
  </div>
  <div class="panel">${filas.length===0?`<div class="empty">${icon('users')}<h3>No hay clientes activos</h3></div>`:filas.map(f=>`
    <div class="trow" style="cursor:default">
      <span class="stamp ${f.atrasado?'off':'on'}"></span>
      <div><div class="tname">${f.c.nombre}</div><div class="tsub" style="font-family:var(--sans)">Frecuencia ${f.c.frecuenciaVisita==='semanal'?'semanal':'mensual'} · ${f.ultima?`última visita hace ${f.dias} día${f.dias===1?'':'s'} (${f.ultima.fecha})`:'sin visitas registradas'}</div></div>
      <div class="tright"><span class="pill ${f.atrasado?'red':'brand'}">${f.atrasado?'Atrasado':'Al día'}</span></div>
    </div>`).join('')}</div>`;
}

/* ---------- WIRING ---------- */
function wireVisitas(){
  document.querySelectorAll('.stab').forEach(b=>b.onclick=()=>{ VIS_SUBTAB=b.dataset.s; renderMain(); });
  const btnNew=document.getElementById('btnNewVis');
  if(btnNew) btnNew.onclick=()=>{
    if(VIS_SUBTAB==='calendario') openProgramarModal(isoDate(new Date()));
    else if(VIS_SUBTAB==='tareas') openTareaModal();
    else openProcesoModal();
  };

  if(VIS_SUBTAB==='calendario'){
    const prev=document.getElementById('calPrev'); if(prev) prev.onclick=()=>{CAL_CURSOR.setMonth(CAL_CURSOR.getMonth()-1); renderMain();};
    const next=document.getElementById('calNext'); if(next) next.onclick=()=>{CAL_CURSOR.setMonth(CAL_CURSOR.getMonth()+1); renderMain();};
    const hoy=document.getElementById('calHoy'); if(hoy) hoy.onclick=()=>{CAL_CURSOR=new Date(); renderMain();};
    document.querySelectorAll('.calAdd').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openProgramarModal(b.dataset.fecha); });
    document.querySelectorAll('.calPill').forEach(p=>p.onclick=()=>openVisitaDetalle(p.dataset.vid));

    const closeP=document.getElementById('closeProgramar'); if(closeP) closeP.onclick=closeProgramarModal;
    const cancelP=document.getElementById('cancelProgramar'); if(cancelP) cancelP.onclick=closeProgramarModal;
    const saveP=document.getElementById('saveProgramar');
    if(saveP) saveP.onclick=async()=>{
      const clienteId=document.getElementById('pgCliente').value;
      if(!clienteId){ toast('Selecciona un cliente','err'); return; }
      const fecha=document.getElementById('pgFecha').value;
      const contador=document.getElementById('pgContador').value;
      DB.visitas.push({id:uid(),clienteId,fecha,contador,estado:'programada',notas:'',checklist:[]});
      await saveVisitas(); toast('Visita programada'); closeProgramarModal(); renderMain();
    };

    const closeD=document.getElementById('closeVisitaDet'); if(closeD) closeD.onclick=closeVisitaDetalle;
    const cancelD=document.getElementById('cancelVisitaDet'); if(cancelD) cancelD.onclick=closeVisitaDetalle;
    const delD=document.getElementById('delVisitaDet');
    if(delD) delD.onclick=async()=>{
      if(!confirm('¿Eliminar esta visita? Esta acción no se puede deshacer.')) return;
      DB.visitas=DB.visitas.filter(v=>v.id!==CUR_VISITA_ID);
      await saveVisitas(); toast('Visita eliminada'); closeVisitaDetalle(); renderMain();
    };
    const addPend=document.getElementById('addPendienteBtn');
    if(addPend) addPend.onclick=()=>{
      const inp=document.getElementById('nuevoPendienteInput');
      const txt=inp.value.trim();
      if(!txt) return;
      NUEVOS_PENDIENTES.push(txt); inp.value=''; renderNuevosPendientes();
    };
    const saveD=document.getElementById('saveVisitaDet');
    if(saveD) saveD.onclick=async()=>{
      const v=DB.visitas.find(x=>x.id===CUR_VISITA_ID);
      v.estado='realizada';
      v.notas=document.getElementById('visDetNotas').value.trim();
      v.checklist=[...document.querySelectorAll('.chkProc')].map(chk=>({procesoId:chk.dataset.pid,hecho:chk.checked}));
      document.querySelectorAll('.chkPendAbierto').forEach(chk=>{
        if(chk.checked){
          const p=DB.pendientes.find(x=>x.id===chk.dataset.pid);
          if(p){ p.resuelto=true; p.resueltoEn=new Date().toISOString(); p.visitaResueltoId=CUR_VISITA_ID; }
        }
      });
      NUEVOS_PENDIENTES.forEach(texto=>{
        DB.pendientes.push({id:uid(),clienteId:v.clienteId,texto,creadoEn:new Date().toISOString(),resuelto:false,visitaOrigenId:CUR_VISITA_ID});
      });
      await saveVisitas(); await savePendientes();
      toast('Visita guardada');
      closeVisitaDetalle(); renderMain();
    };
  }

  if(VIS_SUBTAB==='tareas'){
    document.querySelectorAll('.stab2').forEach(b=>b.onclick=()=>{ TAREAS_FILTRO=b.dataset.f; renderMain(); });
    const srcTarea=document.getElementById('srcTareaInput');
    if(srcTarea) srcTarea.oninput=(e)=>{ TAREAS_SEARCH=e.target.value; renderMain();
      setTimeout(()=>{ const el=document.getElementById('srcTareaInput'); if(el){el.focus(); el.setSelectionRange(TAREAS_SEARCH.length,TAREAS_SEARCH.length);} },0);
    };
    document.querySelectorAll('[data-realizar]').forEach(b=>b.onclick=async()=>{
      const t=DB.tareas.find(x=>x.id===b.dataset.realizar); t.estado='realizada'; await saveTareas(); toast('Marcada como realizada — esperando aprobación'); renderMain();
    });
    document.querySelectorAll('[data-aprobar]').forEach(b=>b.onclick=async()=>{
      const t=DB.tareas.find(x=>x.id===b.dataset.aprobar); t.estado='aprobada'; await saveTareas(); toast('Tarea aprobada'); renderMain();
    });
    document.querySelectorAll('.editT').forEach(b=>b.onclick=()=>openTareaModal(b.dataset.id));
    document.querySelectorAll('.delT').forEach(b=>b.onclick=async()=>{
      DB.tareas=DB.tareas.filter(x=>x.id!==b.dataset.id); await saveTareas(); toast('Tarea eliminada'); renderMain();
    });
    document.querySelectorAll('#respChips .chip').forEach(ch=>ch.onclick=()=>ch.classList.toggle('on'));
    const closeT=document.getElementById('closeTarea'); if(closeT) closeT.onclick=closeTareaModal;
    const cancelT=document.getElementById('cancelTarea'); if(cancelT) cancelT.onclick=closeTareaModal;
    const saveT=document.getElementById('saveTarea');
    if(saveT) saveT.onclick=async()=>{
      const titulo=document.getElementById('tTitulo').value.trim();
      if(!titulo){ toast('El título es obligatorio','err'); return; }
      const responsables=[...document.querySelectorAll('#respChips .chip.on')].map(ch=>ch.dataset.r);
      const data={titulo,descripcion:document.getElementById('tDesc').value.trim(),fechaLimite:document.getElementById('tFecha').value||null,responsables};
      if(EDIT_ID){ const t=DB.tareas.find(x=>x.id===EDIT_ID); Object.assign(t,data); toast('Tarea actualizada'); }
      else{ DB.tareas.push({id:uid(),estado:'pendiente',creadaEn:new Date().toISOString(),...data}); toast('Tarea creada'); TAREAS_FILTRO='activas'; }
      await saveTareas(); closeTareaModal(); renderMain();
    };
  }

  if(VIS_SUBTAB==='procesos'){
    document.querySelectorAll('.editP').forEach(b=>b.onclick=()=>openProcesoModal(b.dataset.id));
    document.querySelectorAll('.delP').forEach(b=>b.onclick=async()=>{
      DB.procesos=DB.procesos.filter(x=>x.id!==b.dataset.id); await saveProcesos(); toast('Proceso eliminado'); renderMain();
    });
    const closeP2=document.getElementById('closeProceso'); if(closeP2) closeP2.onclick=closeProcesoModal;
    const cancelP2=document.getElementById('cancelProceso'); if(cancelP2) cancelP2.onclick=closeProcesoModal;
    const saveP2=document.getElementById('saveProceso');
    if(saveP2) saveP2.onclick=async()=>{
      const cat=document.getElementById('pCat').value.trim();
      const nombre=document.getElementById('pNombre').value.trim();
      if(!cat||!nombre){ toast('Categoría y nombre son obligatorios','err'); return; }
      if(EDIT_ID){ const p=DB.procesos.find(x=>x.id===EDIT_ID); p.cat=cat; p.nombre=nombre; toast('Proceso actualizado'); }
      else{ DB.procesos.push({id:uid(),cat,nombre,activo:true}); toast('Proceso agregado'); }
      await saveProcesos(); closeProcesoModal(); renderMain();
    };
  }
}

let JC_HISTORIAL_TEMP=[];
function openJurCasoModal(id){
  EDIT_ID=id||null;
  const k=id?DB.juridicoCasos.find(x=>x.id===id):null;
  document.getElementById('mJurCasoTitle').textContent=k?'Editar caso':'Nuevo caso';
  document.getElementById('jcCliente').innerHTML=DB.clientes.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');
  if(k) document.getElementById('jcCliente').value=k.clienteId;
  document.getElementById('jcTipo').value=k?k.tipo:'Proceso disciplinario';
  document.getElementById('jcTitulo').value=k?k.titulo:'';
  document.getElementById('jcFechaLlegada').value=k?k.fechaLlegada:new Date().toISOString().slice(0,10);
  document.getElementById('jcEstado').value=k?k.estado:'activo';
  document.getElementById('jcProximaFecha').value=k?(k.proximaFecha||''):'';
  document.getElementById('jcDesc').value=k?(k.descripcion||''):'';
  JC_HISTORIAL_TEMP=k?[...(k.historial||[])]:[];

}
function renderJcHistorial(){
  const wrap=document.getElementById('jcHistorialList');
  wrap.innerHTML=JC_HISTORIAL_TEMP.length?JC_HISTORIAL_TEMP.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map((h,i)=>`<div style="display:flex;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)"><span style="color:var(--ink3);min-width:75px">${h.fecha}</span><span style="flex:1">${h.nota}</span></div>`).join(''):'<div style="font-size:11.5px;color:var(--ink3)">Sin entradas todavía.</div>';
}
function closeJurCasoModal(){ document.getElementById('ovJurCaso').classList.remove('on'); EDIT_ID=null; }

function wireJuridico(){
  document.querySelectorAll('.stab').forEach(b=>b.onclick=()=>{ JUR_SUBTAB=b.dataset.s; renderMain(); });
  const btnNew=document.getElementById('btnNewJur');
  if(btnNew) btnNew.onclick=()=>{ if(JUR_SUBTAB==='catalogo') openJurItemModal(); else if(JUR_SUBTAB==='casos') openJurCasoModal(); };

  const jcFiltro=document.getElementById('jcClienteFiltro'); if(jcFiltro) jcFiltro.onchange=(e)=>{ JUR_CASO_CLIENTE=e.target.value; renderMain(); };
  const srcCaso=document.getElementById('srcCasoInput');
  if(srcCaso) srcCaso.oninput=(e)=>{ JUR_CASO_SEARCH=e.target.value; renderMain();
    setTimeout(()=>{ const el=document.getElementById('srcCasoInput'); if(el){el.focus(); el.setSelectionRange(JUR_CASO_SEARCH.length,JUR_CASO_SEARCH.length);} },0);
  };
  document.querySelectorAll('[data-caso]').forEach(row=>row.onclick=()=>openJurCasoModal(row.dataset.caso));
  const closeJC=document.getElementById('closeJurCaso'); if(closeJC) closeJC.onclick=closeJurCasoModal;
  const cancelJC=document.getElementById('cancelJurCaso'); if(cancelJC) cancelJC.onclick=closeJurCasoModal;
  const addHist=document.getElementById('addHistBtn');
  if(addHist) addHist.onclick=()=>{
    const fecha=document.getElementById('jcHistFecha').value||new Date().toISOString().slice(0,10);
    const nota=document.getElementById('jcHistNota').value.trim();
    if(!nota){ toast('Escribe qué se hizo','err'); return; }
    JC_HISTORIAL_TEMP.push({fecha,nota});
    document.getElementById('jcHistNota').value='';
    renderJcHistorial();
  };
  const delJC=document.getElementById('delJurCaso');
  if(delJC) delJC.onclick=async()=>{
    if(!EDIT_ID){ closeJurCasoModal(); return; }
    if(!confirm('¿Eliminar este caso?')) return;
    DB.juridicoCasos=DB.juridicoCasos.filter(x=>x.id!==EDIT_ID);
    await saveJuridicoCasos(); toast('Caso eliminado'); closeJurCasoModal(); renderMain();
  };
  const saveJC=document.getElementById('saveJurCaso');
  if(saveJC) saveJC.onclick=async()=>{
    const clienteId=document.getElementById('jcCliente').value;
    const titulo=document.getElementById('jcTitulo').value.trim();
    if(!clienteId||!titulo){ toast('Cliente y título son obligatorios','err'); return; }
    const data={
      clienteId, titulo,
      tipo:document.getElementById('jcTipo').value,
      fechaLlegada:document.getElementById('jcFechaLlegada').value,
      estado:document.getElementById('jcEstado').value,
      proximaFecha:document.getElementById('jcProximaFecha').value||null,
      descripcion:document.getElementById('jcDesc').value.trim(),
      historial:JC_HISTORIAL_TEMP
    };
    if(EDIT_ID){ const k=DB.juridicoCasos.find(x=>x.id===EDIT_ID); Object.assign(k,data); toast('Caso actualizado'); }
    else{ DB.juridicoCasos.push({id:uid(),...data}); toast('Caso creado'); }
    await saveJuridicoCasos(); closeJurCasoModal(); renderMain();
  };

  document.querySelectorAll('[data-key]').forEach(row=>row.onclick=()=>openJurEstadoModal(row.dataset.key));
  document.querySelectorAll('#jurEstadoChips .chip').forEach(ch=>ch.onclick=()=>{
    document.querySelectorAll('#jurEstadoChips .chip').forEach(x=>x.classList.remove('on')); ch.classList.add('on');
  });
  const closeJE=document.getElementById('closeJurEstado'); if(closeJE) closeJE.onclick=closeJurEstadoModal;
  const cancelJE=document.getElementById('cancelJurEstado'); if(cancelJE) cancelJE.onclick=closeJurEstadoModal;
  const saveJE=document.getElementById('saveJurEstado');
  if(saveJE) saveJE.onclick=async()=>{
    const chip=document.querySelector('#jurEstadoChips .chip.on');
    const estado=chip?chip.dataset.e:'pendiente';
    const notas=document.getElementById('jurNotas').value.trim();
    DB.juridicoEstados[JUR_CUR_KEY]={estado,notas,actualizadoEn:new Date().toISOString(),por:getIdentidad()||''};
    await saveJuridicoEstados(); toast('Estado actualizado'); closeJurEstadoModal(); renderMain();
  };

  document.querySelectorAll('.editJI').forEach(b=>b.onclick=()=>openJurItemModal(b.dataset.id));
  document.querySelectorAll('.delJI').forEach(b=>b.onclick=async()=>{
    DB.juridicoItems=DB.juridicoItems.filter(x=>x.id!==b.dataset.id); await saveJuridicoItems(); toast('Ítem eliminado'); renderMain();
  });
  const closeJI=document.getElementById('closeJurItem'); if(closeJI) closeJI.onclick=closeJurItemModal;
  const cancelJI=document.getElementById('cancelJurItem'); if(cancelJI) cancelJI.onclick=closeJurItemModal;
  const saveJI=document.getElementById('saveJurItem');
  if(saveJI) saveJI.onclick=async()=>{
    const nombre=document.getElementById('jiNombre').value.trim();
    if(!nombre){ toast('El nombre es obligatorio','err'); return; }
    if(EDIT_ID){ const it=DB.juridicoItems.find(x=>x.id===EDIT_ID); it.nombre=nombre; toast('Ítem actualizado'); }
    else{ DB.juridicoItems.push({id:uid(),nombre,activo:true}); toast('Ítem agregado'); }
    await saveJuridicoItems(); closeJurItemModal(); renderMain();
  };
}

let CLAVES_VISIBLE={};
function rClavesModule(){
  const q=SEARCH.toLowerCase();

function rClavesCliente(c){
  const items=DB.claves.filter(k=>k.clienteId===c.id);

function wireClaves(){
  const btnNew=document.getElementById('btnNewClave'); if(btnNew) btnNew.onclick=()=>openClaveModal();
  const src=document.getElementById('srcClaveInput');
  if(src) src.oninput=(e)=>{ SEARCH=e.target.value; renderMain();
    setTimeout(()=>{ const el=document.getElementById('srcClaveInput'); if(el){el.focus(); el.setSelectionRange(SEARCH.length,SEARCH.length);} },0);
  };
  document.querySelectorAll('.toggleClave').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id;
    const yaVisible=!!CLAVES_VISIBLE[id];
    CLAVES_VISIBLE[id]=!yaVisible;
    if(!yaVisible){
      DB.clavesLog.push({id:uid(),claveId:id,quien:getIdentidad()||'Sin identificar',fecha:new Date().toISOString()});
      await saveClavesLog();
    }
    renderMain();
  });
  document.querySelectorAll('.editK').forEach(b=>b.onclick=()=>openClaveModal(b.dataset.id));
  document.querySelectorAll('.delK').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Eliminar esta clave?')) return;
    DB.claves=DB.claves.filter(x=>x.id!==b.dataset.id); await saveClaves(); toast('Clave eliminada'); renderMain();
  });
  const closeK=document.getElementById('closeClave'); if(closeK) closeK.onclick=closeClaveModal;
  const cancelK=document.getElementById('cancelClave'); if(cancelK) cancelK.onclick=closeClaveModal;
  const saveK=document.getElementById('saveClave');
  if(saveK) saveK.onclick=async()=>{
    const clienteId=document.getElementById('kCliente').value;
    const plataforma=document.getElementById('kPlataforma').value.trim();
    if(!clienteId||!plataforma){ toast('Cliente y plataforma son obligatorios','err'); return; }
    const data={clienteId,plataforma,usuario:document.getElementById('kUsuario').value.trim(),clave:document.getElementById('kClave').value,notas:document.getElementById('kNotas').value.trim()};
    if(EDIT_ID){ const k=DB.claves.find(x=>x.id===EDIT_ID); Object.assign(k,data); toast('Clave actualizada'); }
    else{ DB.claves.push({id:uid(),...data}); toast('Clave guardada'); }
    await saveClaves(); closeClaveModal(); renderMain();
  };
}

let CLI_ROL='todos'; // todos | contabilidad | revisor_fiscal | auditor | renta_pn | otros_terceros
let CLI_RESP='';
let CLI_REGIMEN='';
let CLI_CIUDAD='';
let CLI_CONTACTO='';

function clienteResponsables(c){ return [...new Set(Object.values(c.responsablesPorRol||{}))]; }

let TERC_SUBTAB='terceros'; // terceros | equipo

function closeEquipoModal(){ document.getElementById('ovEquipo').classList.remove('on'); EDIT_ID=null; }
function rRolTabs(){
  const base=DB.clientes.filter(c=>c.estado===FILTRO_ESTADO);
  const cont=(rol)=> rol==='todos' ? base.length : base.filter(c=>(c.roles||[]).includes(rol)).length;
  const tabs=[{id:'todos',label:'Todos'},...ROLES];
  return tabs.map(t=>`<button class="stab ${CLI_ROL===t.id?'on':''}" data-rol="${t.id}">${t.label}<span class="badge-count">${cont(t.id)}</span></button>`).join('');
}
function rClientesList(){
  const q=SEARCH.toLowerCase();
  let list=DB.clientes.filter(c=>c.estado===FILTRO_ESTADO);
  if(CLI_ROL!=='todos') list=list.filter(c=>(c.roles||[]).includes(CLI_ROL));
  if(q) list=list.filter(c=>c.nombre.toLowerCase().includes(q)||c.nit.includes(q));
  if(CLI_RESP) list=list.filter(c=>clienteResponsables(c).includes(CLI_RESP));
  if(CLI_REGIMEN) list=list.filter(c=>c.regimen===CLI_REGIMEN);
  if(CLI_CIUDAD) list=list.filter(c=>c.ciudad===CLI_CIUDAD);
  if(CLI_CONTACTO) list=list.filter(c=>(c.contacto||'')===CLI_CONTACTO);
  list.sort((a,b)=>(a.nit||'').localeCompare(b.nit||'',undefined,{numeric:true}));
  const ciudades=[...new Set(DB.clientes.map(c=>c.ciudad).filter(Boolean))].sort();
  const contactos=[...new Set(DB.clientes.map(c=>(c.contacto||'').trim()).filter(Boolean))].sort();
  return `
  <div class="tb">
    <input class="src" id="srcInput" placeholder="Buscar por nombre o NIT…" value="${SEARCH}">

    <select class="sel" id="respSel"><option value="">Responsable: todos</option>${respOpciones().map(r=>`<option ${CLI_RESP===r?'selected':''}>${r}</option>`).join('')}</select>
    <select class="sel" id="regimenSel"><option value="">Régimen: todos</option>${REGIMENES.map(r=>`<option ${CLI_REGIMEN===r?'selected':''}>${r}</option>`).join('')}</select>

    ${contactos.length?`<select class="sel" id="contactoSel"><option value="">Contacto/referido: todos</option>${contactos.map(c=>`<option ${CLI_CONTACTO===c?'selected':''}>${c}</option>`).join('')}</select>`:''}

function emptyClientes(){
  const filtrando = SEARCH||CLI_ROL!=='todos'||CLI_RESP||CLI_REGIMEN||CLI_CIUDAD||CLI_CONTACTO;
  return `<div class="empty">${icon('users')}<h3>${filtrando?'Sin resultados con estos filtros':'Todavía no hay clientes'+(FILTRO_ESTADO==='retirado'?' retirados':'')}</h3><p>${filtrando?'Prueba ajustando el rol, responsable, régimen, ciudad o contacto.':'Crea el primer cliente para empezar a generar sus vencimientos automáticamente.'}</p>${!filtrando?'<button class="btn primary" id="btnEmptyNew">'+icon('plus')+'Nuevo cliente</button>':''}</div>`;
}
function rClienteRow(c){
  const roles=(c.roles||[]).map(r=>{
    const def=ROLES.find(x=>x.id===r);
    return `<span class="pill ${r==='contabilidad'?'brand':r==='renta_pn'?'amber':'gray'}">${def?def.label:r}</span>`;

  const nombresResp=clienteResponsables(c);
  return `<div class="trow" data-id="${c.id}">

      <div class="tsub">NIT ${c.nit} · ${c.regimen||'—'} · ${c.ciudad||'—'} · visita ${c.frecuenciaVisita==='semanal'?'semanal':'mensual'}${c.contacto?' · '+c.contacto:''}</div>
    </div>
    <div class="tright">
      <div class="roles">${roles}</div>
      <span style="font-size:11px;color:var(--ink3)">${nombresResp.length?nombresResp.join(', '):'Sin asignar'}</span>
      <button class="iconbtn editC" data-id="${c.id}" title="Editar">${icon('edit')}</button>
      <button class="iconbtn archC" data-id="${c.id}" title="${c.estado==='activo'?'Archivar':'Reactivar'}">${icon('archive')}</button>
    </div>
  </div>`;
}
function modalClienteHTML(){

  const respSel=document.getElementById('respSel'); if(respSel) respSel.onchange=(e)=>{ CLI_RESP=e.target.value; renderMain(); };
  const regimenSel=document.getElementById('regimenSel'); if(regimenSel) regimenSel.onchange=(e)=>{ CLI_REGIMEN=e.target.value; renderMain(); };
  const ciudadSel=document.getElementById('ciudadSel'); if(ciudadSel) ciudadSel.onchange=(e)=>{ CLI_CIUDAD=e.target.value; renderMain(); };
  const contactoSel=document.getElementById('contactoSel'); if(contactoSel) contactoSel.onchange=(e)=>{ CLI_CONTACTO=e.target.value; renderMain(); };

  document.querySelectorAll('.editC').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openClienteModal(b.dataset.id); });
  document.querySelectorAll('.archC').forEach(b=>b.onclick=async(e)=>{
    e.stopPropagation();
    const c=DB.clientes.find(x=>x.id===b.dataset.id);
    c.estado = c.estado==='activo' ? 'retirado' : 'activo';
    await saveClientes(); toast(c.estado==='activo'?'Cliente reactivado':'Cliente archivado'); renderMain();
  });

  document.querySelectorAll('#rolesChips .chip').forEach(ch=>ch.onclick=()=>ch.classList.toggle('on'));

  if(fRegimenSel) fRegimenSel.onchange=(e)=>{
    const pIva=document.getElementById('fPeriodicidadIVA');
    if(e.target.value==='RST') pIva.value='anual';
    else if(pIva.value==='anual') pIva.value='bimestral';
  };
  document.querySelectorAll('#etiquetasChips .chip').forEach(ch=>ch.onclick=()=>ch.classList.toggle('on'));

  const closeC=document.getElementById('closeCliente'); if(closeC) closeC.onclick=closeClienteModal;
  const cancelC=document.getElementById('cancelCliente'); if(cancelC) cancelC.onclick=closeClienteModal;
  const saveC=document.getElementById('saveCliente');
  if(saveC) saveC.onclick=async()=>{
    const nombre=document.getElementById('fNombre').value.trim();
    const nit=document.getElementById('fNit').value.trim();
    if(!nombre||!nit){ toast('Nombre y NIT son obligatorios','err'); return; }
    const roles=[...document.querySelectorAll('#rolesChips .chip.on')].map(ch=>ch.dataset.r);
    const etiquetas=[...document.querySelectorAll('#etiquetasChips .chip.on')].map(ch=>ch.dataset.e);
    const responsablesPorRol={};
    document.querySelectorAll('.rprSel').forEach(sel=>{ if(sel.value) responsablesPorRol[sel.dataset.role]=sel.value; });
    const data={
      nombre, nit,
      regimen:document.getElementById('fRegimen').value,
      ciudad:document.getElementById('fCiudad').value.trim(),
      frecuenciaVisita:document.getElementById('fFrecuencia').value,
      periodicidadIVA:document.getElementById('fPeriodicidadIVA').value,
      contacto:document.getElementById('fContacto').value.trim(),
      responsabilidades:document.getElementById('fResp').value.trim(),
      roles, responsablesPorRol, etiquetas
    };
    if(EDIT_ID){
      const c=DB.clientes.find(x=>x.id===EDIT_ID);
      Object.assign(c,data);
      toast('Cliente actualizado');
    }else{
      DB.clientes.push({id:uid(),estado:'activo',...data});
      toast('Cliente creado');
    }
    await saveClientes(); closeClienteModal(); renderMain();
  };
}

/* ================= MÓDULO REPORTES ================= */
function rReportesModule(){
  const hoy=new Date();
  const y=hoy.getFullYear(), m=hoy.getMonth()+1;
  const vencMes=computeVencimientosMes(y,m);
  const vencCump=vencMes.filter(v=>v.cumplido).length;
  const vencPend=vencMes.filter(v=>!v.cumplido).length;
  const pctCump=vencMes.length?Math.round(vencCump/vencMes.length*100):0;

  const porCategoria=agruparLista(vencMes,'categoria')||[];

  const equipoActivo=DB.equipo.filter(e=>e.activo);
  const cargaEquipo=equipoActivo.map(e=>{
    const tareasResp=DB.tareas.filter(t=>(t.responsables||[]).includes(e.nombre));
    const vencResp=vencMes.filter(v=>v.responsable.includes(e.nombre));
    return{
      nombre:e.nombre,rol:e.rol,
      tareasPend:tareasResp.filter(t=>t.estado==='pendiente').length,
      tareasPorAprobar:tareasResp.filter(t=>t.estado==='realizada').length,
      vencPend:vencResp.filter(v=>!v.cumplido).length,
      vencCump:vencResp.filter(v=>v.cumplido).length
    };
  });

  const semanaList=computeVencimientosSemana();
  const clientesRiesgoMap={};
  semanaList.filter(v=>!v.cumplido).forEach(v=>{
    clientesRiesgoMap[v.clienteId]=clientesRiesgoMap[v.clienteId]||{nombre:v.clienteNombre,count:0};
    clientesRiesgoMap[v.clienteId].count++;
  });
  const clientesRiesgo=Object.values(clientesRiesgoMap).sort((a,b)=>b.count-a.count).slice(0,8);

  const activosClientes=DB.clientes.filter(c=>c.estado==='activo');
  let visitasAlDia=0,visitasAtrasadas=0;
  activosClientes.forEach(c=>{
    const visitasCliente=DB.visitas.filter(v=>v.clienteId===c.id&&v.estado==='realizada').sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const ultima=visitasCliente[0];
    const dias=ultima?Math.floor((hoy-new Date(ultima.fecha+'T00:00:00'))/86400000):null;
    const limite=c.frecuenciaVisita==='semanal'?7:30;
    (dias===null||dias>limite)?visitasAtrasadas++:visitasAlDia++;
  });

  const casosActivos=DB.juridicoCasos.filter(k=>k.estado==='activo');

  return `
  <div class="ph">
    <div><h1>Reportes</h1><p>Resumen de cumplimiento del mes en curso — ${MESES[m-1]} ${y}</p></div>
    <button class="btn" id="btnReporteRespaldo">${icon('archive')}Exportar todo a Excel</button>
  </div>

  <div class="metrics">
    <div class="mc"><div class="mc-l">Vencimientos del mes</div><div class="mc-n">${vencMes.length}</div></div>
    <div class="mc"><div class="mc-l">Cumplidos</div><div class="mc-n" style="color:var(--brand)">${vencCump}</div></div>
    <div class="mc"><div class="mc-l">Pendientes</div><div class="mc-n" style="color:var(--amber)">${vencPend}</div></div>
    <div class="mc"><div class="mc-l">% cumplimiento</div><div class="mc-n" style="color:${pctCump>=80?'var(--brand)':pctCump>=50?'var(--amber)':'var(--red)'}">${pctCump}%</div></div>
  </div>

  <div class="card" style="background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px">
    <div class="ct" style="font-size:12px;font-weight:500;margin-bottom:10px">Vencimientos del mes por categoría</div>
    ${porCategoria.length===0?'<div style="font-size:11.5px;color:var(--ink3)">Sin vencimientos este mes.</div>':porCategoria.map(g=>{
      const cump=g.items.filter(v=>v.cumplido).length;
      return `<div class="trow" style="cursor:default"><div class="tname" style="font-size:12.5px">${g.label}</div><div class="tright"><span class="pill brand">${cump} cumplidos</span><span class="pill amber">${g.items.length-cump} pendientes</span></div></div>`;
    }).join('')}
  </div>

  <div class="card" style="background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px">
    <div class="ct" style="font-size:12px;font-weight:500;margin-bottom:10px">Carga de trabajo por profesional (este mes)</div>
    ${cargaEquipo.length===0?'<div style="font-size:11.5px;color:var(--ink3)">Agrega profesionales en Terceros → Equipo de trabajo.</div>':cargaEquipo.map(e=>`
    <div class="trow" style="cursor:default">
      <div><div class="tname" style="font-size:12.5px">${e.nombre}</div><div class="tsub" style="font-family:var(--sans)">${e.rol}</div></div>
      <div class="tright">
        <span class="pill amber">${e.vencPend} venc. pend.</span>
        <span class="pill gray">${e.tareasPend} tareas pend.</span>
        ${e.tareasPorAprobar?`<span class="pill brand">${e.tareasPorAprobar} por aprobar</span>`:''}
      </div>
    </div>`).join('')}
  </div>

  <div class="metrics">
    <div class="mc"><div class="mc-l">Visitas al día</div><div class="mc-n" style="color:var(--brand)">${visitasAlDia}</div></div>
    <div class="mc"><div class="mc-l">Visitas atrasadas</div><div class="mc-n" style="color:var(--red)">${visitasAtrasadas}</div></div>
    <div class="mc"><div class="mc-l">Casos jurídicos activos</div><div class="mc-n" style="color:var(--amber)">${casosActivos.length}</div></div>
  </div>

  <div class="card" style="background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px">
    <div class="ct" style="font-size:12px;font-weight:500;margin-bottom:10px">Clientes en riesgo — más vencimientos pendientes esta semana</div>
    ${clientesRiesgo.length===0?'<div style="font-size:11.5px;color:var(--ink3)">Ningún cliente tiene vencimientos pendientes esta semana. Buen trabajo.</div>':clientesRiesgo.map(c=>`
    <div class="trow" style="cursor:default"><div class="tname" style="font-size:12.5px">${c.nombre}</div><div class="tright"><span class="pill red">${c.count} pendiente${c.count===1?'':'s'}</span></div></div>`).join('')}

function wireReportes(){
  const btn=document.getElementById('btnReporteRespaldo');
  if(btn) btn.onclick=exportarRespaldo;
}

/* ================= MÓDULO INICIO ================= */
function rInicioModule(){
  const yo=getIdentidad();
  const {nombre:yoNombre}=parseIdentidad(yo);
  const hoy=new Date();
  const hoyIso=isoDate(hoy);
  const y=hoy.getFullYear(), m=hoy.getMonth()+1;

  const misTareas=DB.tareas.filter(t=>t.estado==='pendiente' && (t.responsables||[]).includes(yoNombre))
    .sort((a,b)=>(a.fechaLimite||'9999').localeCompare(b.fechaLimite||'9999'));

  const misVisitasHoy=DB.visitas.filter(v=>v.fecha===hoyIso && v.contador===yoNombre && v.estado==='programada');

  const vencMes=computeVencimientosMes(y,m);
  const vencHoy=vencMes.filter(v=>!v.cumplido && v.responsable.includes(yoNombre) && isoDate(v.fecha)===hoyIso);
  const semana=computeVencimientosSemana().filter(v=>!v.cumplido && v.responsable.includes(yoNombre));

  const diasSem=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  return `
  <div class="ph">
    <div><h1>Hola, ${yoNombre.split(' ')[0]}</h1><p>${diasSem[hoy.getDay()]} ${hoy.getDate()} de ${MESES[hoy.getMonth()]} de ${y}</p></div>
    <button class="btn" id="btnCompartirResumen">${icon('whatsapp')}Compartir resumen</button>
  </div>
  <div class="metrics">
    <div class="mc"><div class="mc-l">Visitas de hoy</div><div class="mc-n">${misVisitasHoy.length}</div></div>
    <div class="mc"><div class="mc-l">Tareas pendientes</div><div class="mc-n" style="color:var(--amber)">${misTareas.length}</div></div>
    <div class="mc"><div class="mc-l">Vencimientos hoy</div><div class="mc-n" style="color:var(--red)">${vencHoy.length}</div></div>
    <div class="mc"><div class="mc-l">Próximos 7 días</div><div class="mc-n" style="color:var(--amber)">${semana.length}</div></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div style="padding:11px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px">Tu agenda de hoy</div>
    ${misVisitasHoy.length===0?`<div class="empty" style="padding:30px 20px">${icon('map')}<h3>Sin visitas programadas hoy</h3><p>Prográmalas desde Visitas y tareas → Calendario.</p></div>`:misVisitasHoy.map(v=>{
      const c=DB.clientes.find(x=>x.id===v.clienteId);
      return `<div class="trow" data-abrir-visita="${v.id}"><div class="tname">${c?c.nombre:'Cliente'}</div><div class="tright"><span class="pill amber">Programada</span></div></div>`;
    }).join('')}
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div style="padding:11px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px">Vencimientos de hoy</div>
    ${vencHoy.length===0?`<div class="empty" style="padding:30px 20px">${icon('cal')}<h3>Nada vence hoy</h3></div>`:vencHoy.map(v=>`
    <div class="trow" style="cursor:default">
      <input type="checkbox" class="chkVencInicio" data-key="${v.key}" style="width:16px;height:16px;accent-color:var(--brand);cursor:pointer">
      <div><div class="tname">${v.clienteNombre}</div><div class="tsub" style="font-family:var(--sans)">${v.obligNombre}</div></div>
    </div>`).join('')}
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div style="padding:11px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px">Próximos 7 días</div>
    ${semana.length===0?`<div class="empty" style="padding:30px 20px">${icon('cal')}<h3>Nada pendiente esta semana</h3></div>`:semana.map(v=>`
    <div class="trow" style="cursor:default">
      <input type="checkbox" class="chkVencInicio" data-key="${v.key}" style="width:16px;height:16px;accent-color:var(--brand);cursor:pointer">
      <div><div class="tname">${v.clienteNombre}</div><div class="tsub" style="font-family:var(--sans)">${v.obligNombre}</div></div>
      <div class="tright"><span class="pill amber">${fmtFecha(v.fecha)}</span></div>
    </div>`).join('')}
  </div>

  <div class="panel">
    <div style="padding:11px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px">Tus tareas pendientes</div>
    ${misTareas.length===0?`<div class="empty" style="padding:30px 20px">${icon('check')}<h3>Sin tareas pendientes</h3></div>`:misTareas.map(t=>`
    <div class="trow" style="cursor:default">
      <div><div class="tname">${t.titulo}</div>${t.fechaLimite?`<div class="tsub" style="font-family:var(--sans)">Vence ${t.fechaLimite}</div>`:''}</div>
      <div class="tright"><button class="btn sm" data-realizar-inicio="${t.id}">Marcar realizada</button></div>
    </div>`).join('')}
  </div>`;
}
function wireInicio(){
  document.querySelectorAll('[data-abrir-visita]').forEach(row=>row.onclick=()=>{ VIEW='visitas'; VIS_SUBTAB='calendario'; renderShell(); setTimeout(()=>openVisitaDetalle(row.dataset.abrirVisita),50); });
  document.querySelectorAll('.chkVencInicio').forEach(chk=>chk.onchange=async(e)=>{
    const key=chk.dataset.key;
    DB.vencEstados[key]={cumplido:e.target.checked,fecha:new Date().toISOString()};
    await saveVencEstados(); toast('Marcado como cumplido'); renderMain();
  });
  document.querySelectorAll('[data-realizar-inicio]').forEach(b=>b.onclick=async()=>{
    const t=DB.tareas.find(x=>x.id===b.dataset.realizarInicio); t.estado='realizada'; await saveTareas(); toast('Marcada como realizada — esperando aprobación'); renderMain();
  });
  const btnShare=document.getElementById('btnCompartirResumen');
  if(btnShare) btnShare.onclick=abrirCompartirResumen;
}

function generarResumenTexto(){
  const hoy=new Date(); const y=hoy.getFullYear(), m=hoy.getMonth()+1;
  const hoyIso=isoDate(hoy);
  const vencMes=computeVencimientosMes(y,m);
  const hoyList=vencMes.filter(v=>!v.cumplido && isoDate(v.fecha)===hoyIso);
  const semana=computeVencimientosSemana().filter(v=>!v.cumplido);
  const pendMes=vencMes.filter(v=>!v.cumplido);
  let txt=`*Cortiz Asesores* — resumen ${hoy.toLocaleDateString('es-CO')}\n\n`;
  txt+=`*Vencen hoy (${hoyList.length}):*\n`;
  txt+= hoyList.length? hoyList.map(v=>`• ${v.clienteNombre} — ${v.obligNombre}`).join('\n') : 'Ninguno';
  txt+=`\n\n*Próximos 7 días (${semana.length}):*\n`;
  txt+= semana.length? semana.map(v=>`• ${v.clienteNombre} — ${v.obligNombre} (${fmtFecha(v.fecha)})`).join('\n') : 'Ninguno';
  txt+=`\n\n*Pendientes del mes: ${pendMes.length} de ${vencMes.length}*`;
  return txt;
}
function abrirCompartirResumen(){
  const texto=generarResumenTexto();
  const overlay=document.createElement('div');
  overlay.className='overlay on';
  overlay.innerHTML=`<div class="modal" style="max-width:520px">
    <div class="mhead"><h2>Compartir resumen</h2><button class="iconbtn" id="closeShareModal">${icon('x')}</button></div>
    <div class="mbody">
      <div class="fg"><label>Vista previa (puedes editar antes de enviar)</label><textarea id="shareText" rows="12" style="width:100%;font-family:var(--mono);font-size:11.5px;padding:9px 11px;border:1px solid var(--line2);border-radius:7px;background:var(--paper)">${texto}</textarea></div>
      <p style="font-size:11px;color:var(--ink3);margin-top:8px">Esto abre WhatsApp o tu correo con el mensaje ya listo — tú confirmas el envío desde ahí. La app no lo manda sola ni de forma automática todavía.</p>
    </div>
    <div class="mfoot">
      <button class="btn" id="shareEmail">${icon('mail')}Por correo</button>
      <button class="btn primary" id="shareWA">${icon('whatsapp')}Por WhatsApp</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('closeShareModal').onclick=()=>document.body.removeChild(overlay);
  document.getElementById('shareWA').onclick=()=>{
    window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('shareText').value)}`,'_blank');
  };
  document.getElementById('shareEmail').onclick=()=>{
    window.open(`mailto:?subject=${encodeURIComponent('Resumen de vencimientos - Cortiz Asesores')}&body=${encodeURIComponent(document.getElementById('shareText').value)}`,'_blank');
  };
}

/* ================= RESPALDO Y AUTOGUARDADO ================= */
function exportarRespaldo(){
  try{
    const wb=XLSX.utils.book_new();
    const addSheet=(name,rows)=>{
      const clean=(rows||[]).map(r=>{
        const o={...r};
        Object.keys(o).forEach(k=>{ if(typeof o[k]==='object'&&o[k]!==null) o[k]=JSON.stringify(o[k]); });
        return o;
      });
      const ws=XLSX.utils.json_to_sheet(clean.length?clean:[{info:'Sin datos'}]);
      XLSX.utils.book_append_sheet(wb,ws,name);
    };
    addSheet('Clientes',DB.clientes);
    addSheet('Biblioteca',DB.biblioteca);
    addSheet('Tareas',DB.tareas);
    addSheet('Visitas',DB.visitas);
    addSheet('Pendientes',DB.pendientes);
    addSheet('Procesos',DB.procesos);
    addSheet('Claves',DB.claves);
    addSheet('Juridico_items',DB.juridicoItems);
    addSheet('Juridico_estados',Object.entries(DB.juridicoEstados).map(([k,v])=>({clave:k,...v})));
    addSheet('Juridico_casos',DB.juridicoCasos);
    addSheet('Equipo',DB.equipo);
    const fecha=new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb,`cortiz-respaldo-${fecha}.xlsx`);
    toast('Respaldo descargado');
  }catch(e){ toast('No se pudo generar el respaldo','err'); }
}
let ULTIMO_GUARDADO=new Date();
async function autoguardarTodo(){
  try{
    await Promise.all([saveClientes(),saveBiblioteca(),saveVencEstados(),saveTareas(),saveProcesos(),saveVisitas(),savePendientes(),saveClaves(),saveJuridicoItems(),saveJuridicoEstados(),saveJuridicoCasos(),saveEquipo()]);
    ULTIMO_GUARDADO=new Date();
  }catch(e){}
  const lbl=document.getElementById('autosaveLabel');
  if(lbl) lbl.title=`Guardado ${ULTIMO_GUARDADO.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
}

/* ================= INIT ================= */
async function init(){
  await loadAll();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  renderShell();
  if(!getIdentidad()) abrirSelectorIdentidad();
  setInterval(autoguardarTodo,10000);
}
init();
</script>
